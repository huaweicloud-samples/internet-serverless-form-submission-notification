<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Form Submission Demo</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; padding: 32px; background: #f5f7fa; color: #1f2937;
           font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 560px; margin: 0 auto; background: #fff; padding: 28px 32px;
           border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
    h1 { font-size: 22px; margin: 0 0 6px; }
    p.hint { color: #6b7280; margin: 0 0 22px; font-size: 13px; }
    label { display: block; margin: 14px 0 5px; font-weight: 600; font-size: 13px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 9px 11px;
                      border: 1px solid #d1d5db; border-radius: 6px; font: inherit; }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, textarea:focus { outline: 2px solid #2563eb33; border-color: #2563eb; }
    button { margin-top: 20px; padding: 10px 20px; border: 0; border-radius: 6px;
             background: #2563eb; color: #fff; font: inherit; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    pre { margin-top: 18px; padding: 12px; border-radius: 6px; background: #f3f4f6;
          white-space: pre-wrap; word-break: break-all; font-size: 12px; }
    .ok { color: #047857; } .err { color: #b91c1c; }
  </style>
</head>
<body>
  <main>
    <h1>Form Submission Demo</h1>
    <p class="hint">Paste the form endpoint printed by <code>terraform output api_endpoint</code>, then submit. The request persists the payload and publishes a notification in the same invocation.</p>

    <label for="endpoint">Form endpoint</label>
    <input id="endpoint" type="url" placeholder="https://.../release/submitForm" required>

    <form id="demo-form">
      <label for="name">Name</label>
      <input id="name" name="name" value="Sender Name" required>

      <label for="reply_to">Reply address</label>
      <input id="reply_to" name="reply_to" type="email" value="sender@example.com" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" required>A test message</textarea>

      <button id="submit" type="submit">Submit form</button>
    </form>

    <pre id="result">Not submitted yet.</pre>
  </main>

  <script src="form.js"></script>
  <script>
    (function () {
      var form = document.getElementById('demo-form');
      var endpoint = document.getElementById('endpoint');
      var result = document.getElementById('result');
      var button = document.getElementById('submit');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        button.disabled = true;
        result.className = '';
        result.textContent = 'Submitting...';
        try {
          var response = await formClient.submitForm(endpoint.value.trim(), formClient.collect(form));
          result.className = response.ok ? 'ok' : 'err';
          result.textContent = 'HTTP ' + response.status + '\n' + response.text;
        } catch (err) {
          result.className = 'err';
          result.textContent = 'Request failed: ' + err.message;
        } finally {
          button.disabled = false;
        }
      });
    })();
  </script>
</body>
</html>
